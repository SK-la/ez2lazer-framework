name: Pack and publish NuGet

on:
  push:
    tags:
      # 仅 Ez 发布 tag；上游 ppy tag（如 2026.724.0）不会匹配
      - '*.*.*-ez2lazer'
  workflow_dispatch:
    inputs:
      version:
        description: 'NuGet 包版本（与已存在的 tag 一致，例如 2026.524.4-ez2lazer）'
        required: true
        type: string

permissions:
  contents: write # GitHub Release
  id-token: write # NuGet Trusted Publishing

jobs:
  pack-framework:
    name: Pack (ez2lazer.Framework)
    # 仅本人推送的 tag / 手动触发，避免他人或异常推送误发
    if: github.actor == 'SK-la'
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Guard tag pusher
        shell: bash
        run: |
          echo "actor=${{ github.actor }} event=${{ github.event_name }} ref=${{ github.ref }}"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            case "${{ github.ref_name }}" in
              *.*.*-ez2lazer) ;;
              *)
                echo "::error::Tag '${{ github.ref_name }}' is not an Ez2Lazer release tag (expected *.*.*-ez2lazer)."
                exit 1
                ;;
            esac
          fi

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Pack
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          dotnet pack -c Release osu.Framework `
            /p:Version=${{ steps.version.outputs.value }} `
            /p:GenerateDocumentationFile=true `
            /p:IncludeSymbols=true `
            /p:SymbolPackageFormat=snupkg `
            -o artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: ez2lazer-framework
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

      # NuGet 可信发布：SK-la/ez2lazer-framework + deploy-pack.yml（无需长期 NUGET_API_KEY）
      - name: NuGet login (Trusted Publishing / OIDC)
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: SK_LA

      - name: Publish packages to nuget.org
        id: nuget_publish
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $apiKey = '${{ steps.nuget_login.outputs.NUGET_API_KEY }}'
          $log = Join-Path $env:RUNNER_TEMP 'nuget-push.log'
          $failed = $false
          Get-ChildItem artifacts -Filter *.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName `
              --api-key $apiKey `
              --source https://api.nuget.org/v3/index.json `
              2>&1 | Tee-Object -FilePath $log -Append
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) {
            $content = Get-Content $log -Raw
            if ($content -match 'already exists|package ID is reserved') {
              Write-Error "推送失败。若 reserved：包 ID 被保留；若 already exists：版本 $version 已存在。`nhttps://www.nuget.org/packages/ez2lazer.Framework/$version"
            }
            exit 1
          }
          Write-Host "Published (Trusted Publishing): https://www.nuget.org/packages/ez2lazer.Framework/$version"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.value }}'

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists, skip create."
            exit 0
          fi

          if ! git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag '$VERSION' does not exist locally. Push the tag first (or use a version that matches an existing tag)."
            exit 1
          fi

          # 正文使用 GitHub 自动生成的 Release notes（相对上一 Release 的提交/PR 摘要）
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            --verify-tag

          echo "Release: https://github.com/${{ github.repository }}/releases/tag/$VERSION"
